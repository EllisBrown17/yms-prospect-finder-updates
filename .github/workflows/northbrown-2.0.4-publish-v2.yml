name: Publish NORTHBROWN 2.0.4 corrected

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  publish:
    if: contains(github.event.pull_request.title, 'NORTHBROWN 2.0.4 RELEASE V2')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Build and validate 2.0.4 from verified 2.0.3
        shell: bash
        run: |
          set -euo pipefail
          VERSION='2.0.4'
          WORK="$(mktemp -d)"
          mkdir -p "$WORK/base203" northbrown/releases

          # Reconstruct the exact previously validated full 2.0.3 package.
          # This transport exists only inside GitHub CI; the Mac receives one normal binary ZIP.
          cat northbrown/staging/2.0.3/direct.part* | base64 -d > "$WORK/base203.zip"
          test "$(wc -c < "$WORK/base203.zip")" -eq 164006
          echo '2aea7e70f0cde99c55587bd84ad6c8601e17c35798eb1e4ef2c82a414c95c4a7  '"$WORK/base203.zip" | sha256sum -c -
          unzip -t "$WORK/base203.zip" >/dev/null
          unzip -q "$WORK/base203.zip" -d "$WORK/base203"
          cp -R "$WORK/base203/payload" "$WORK/payload"
          P="$WORK/payload"

          # Validate the full base before modifying it.
          for f in app.py feature_routes.py builder_routes.py requirements.txt VERSION.txt release.json START_NORTHBROWN_INTERNAL.sh static/app.js static/app.css templates/index.html NORTHBROWN_ICON.png static/NORTHBROWN_ICON.png; do
            test -f "$P/$f"
          done
          test "$(tr -d '\r\n' < "$P/VERSION.txt")" = '2.0.3'
          grep -q "APP_VERSION = '2.0.3'" "$P/app.py"
          python -m py_compile "$P/app.py" "$P/feature_routes.py" "$P/builder_routes.py"
          node --check "$P/static/app.js"

          # Apply the category-aware generation upgrade.
          cat northbrown/staging/2.0.4/patch.part* > "$WORK/204.patch"
          test "$(wc -c < "$WORK/204.patch")" -eq 35765
          (cd "$WORK" && patch --batch -p0 < "$WORK/204.patch")

          # Restore the NORTHBROWN brand-theme UI and add live Scan Intelligence collapse.
          cat northbrown/staging/2.0.4/final-ui.part* > "$WORK/final-ui.patch"
          test "$(wc -c < "$WORK/final-ui.patch")" -eq 22275
          (cd "$WORK" && patch --batch -p0 < "$WORK/final-ui.patch")
          rm -f "$P/release.json"

          # Build an internal manifest from the exact final files.
          python - "$P" <<'PY'
          from pathlib import Path
          import hashlib,json,sys
          p=Path(sys.argv[1])
          required=['app.py','feature_routes.py','builder_routes.py','requirements.txt','VERSION.txt','START_NORTHBROWN_INTERNAL.sh','static/app.js','static/app.css','templates/index.html','NORTHBROWN_ICON.png','static/NORTHBROWN_ICON.png']
          r={'format':'northbrown-full-v2','version':'2.0.4','allowed_from':['2.0.2','2.0.3'],'database_schema':5,'files':{}}
          for rel in required:
              f=p/rel
              if not f.is_file(): raise SystemExit('Missing required file: '+rel)
              r['files'][rel]=hashlib.sha256(f.read_bytes()).hexdigest()
          (p/'release.json').write_text(json.dumps(r,indent=2)+'\n')
          PY

          # Hard release gates: do not publish a partial or broken build.
          test "$(tr -d '\r\n' < "$P/VERSION.txt")" = '2.0.4'
          python -m py_compile "$P/app.py" "$P/feature_routes.py" "$P/builder_routes.py"
          node --check "$P/static/app.js"
          grep -q "APP_VERSION = '2.0.4'" "$P/app.py"
          grep -q "@app.post('/api/smart-finder')" "$P/app.py"
          grep -q "Fades & short styles" "$P/builder_routes.py"
          grep -q "Beard grooming" "$P/builder_routes.py"
          grep -q "scanCollapseBtn" "$P/templates/index.html"
          grep -q "BRAND THEME" "$P/templates/index.html"
          grep -q "NORTHBROWN_ICON.png?v=204-final" "$P/templates/index.html"
          grep -q "Free Google tools for websites" "$P/templates/index.html"
          grep -q "Created by Ellis Brown / NORTHBROWN" "$P/builder_routes.py"

          rm -rf "$P/__pycache__"
          ZIP="northbrown/releases/NORTHBROWN-update-${VERSION}.zip"
          (cd "$WORK" && zip -qr "$GITHUB_WORKSPACE/$ZIP" payload)
          unzip -t "$ZIP" >/dev/null
          test "$(wc -c < "$ZIP")" -gt 120000
          SHA="$(sha256sum "$ZIP" | awk '{print $1}')"
          SIZE="$(wc -c < "$ZIP" | tr -d ' ')"

          cat > northbrown/update.json <<EOF
          {
            "schema": 2,
            "version": "2.0.4",
            "allowed_from": ["2.0.2", "2.0.3"],
            "download_url": "https://raw.githubusercontent.com/EllisBrown17/yms-prospect-finder-updates/main/${ZIP}",
            "size": ${SIZE},
            "sha256": "${SHA}",
            "notes": "NORTHBROWN 2.0.4: smarter category-accurate website generation, Smart Finder, free Google website tools, NORTHBROWN logo in the Mac launcher and browser, restored NORTHBROWN brand theme controls/reference and collapsible Scan Intelligence.",
            "published_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "mandatory": false
          }
          EOF

      - name: Publish live OTA
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NORTHBROWN OTA Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add northbrown/releases/NORTHBROWN-update-2.0.4.zip northbrown/update.json
          git commit -m 'Publish NORTHBROWN OTA 2.0.4 final build'
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep 2
          done
          exit 1
