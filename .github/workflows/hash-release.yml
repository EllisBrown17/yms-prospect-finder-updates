name: Build and validate V4.2 release package

on:
  push:
    paths:
      - 'releases/**'
      - '.github/workflows/hash-release.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Decode deterministic source and publish real binary ZIP
        shell: bash
        run: |
          set -e
          mkdir -p hashes
          SRC='releases/4.2.0/YMS_Prospect_Finder_V4_2_0_DETERMINISTIC.zip.b64'
          OUT='releases/4.2.0/YMS_Prospect_Finder_V4_2_0_BINARY.zip'
          base64 --decode "$SRC" > "$OUT"
          unzip -t "$OUT" | tee hashes/v4.2.0-binary-validation.txt
          sha256sum "$OUT" | awk '{print $1}' > hashes/v4.2.0-binary-sha256.txt
          file "$OUT" >> hashes/v4.2.0-binary-validation.txt
          git config user.name 'YMS Prospect Finder Updater'
          git config user.email 'actions@users.noreply.github.com'
          git add "$OUT" hashes/v4.2.0-binary-validation.txt hashes/v4.2.0-binary-sha256.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Publish validated binary V4.2.0 OTA ZIP'
            git push
          fi
