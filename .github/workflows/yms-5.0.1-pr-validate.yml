name: Validate YMS 5.0.1 navigation hotfix
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Reproduce exact 5.0.0 inline-handler failure and validate repair
        run: |
          set -euo pipefail
          rm -rf /tmp/yms500 && mkdir -p /tmp/yms500
          unzip -o releases/5.0.0/YMS_Prospect_Finder_V5_0_0_PRODUCT_OUTREACH_INTELLIGENCE.zip -d /tmp/yms500 >/dev/null
          python3 -m py_compile releases/5.0.1/source/server.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          old=Path('/tmp/yms500/server.py').read_text('utf-8')
          ns={'__name__':'fixture500','__file__':'/tmp/yms500/server.py'}
          exec(compile(old,'server500.py','exec'),ns)
          base='''<!doctype html><html><head><title>YMS Prospect Finder V4.2.11 — YMS-Tools</title><style></style></head><body><b id="versionLabel">Prospect Finder V4.2.11</b><nav><button class="nav" onclick="show('prospects',this)">Prospects</button><button class="nav" onclick="show('settings',this)">Settings</button></nav><section id="settings" class="view"><div class="box"><div class="ey">WHY YMS</div></div></section></body></html>'''
          generated=ns['patch_html'](base)
          # V5 main script itself is valid; the failure is in the two inline nav handlers.
          v5=ns['V5_JS']; js=v5[v5.find('<script>')+8:v5.rfind('</script>')]
          Path('/tmp/v5-main.js').write_text(js,encoding='utf-8')
          handlers={}
          for key in ('products','outreach'):
              m=re.search(r'data-view="'+key+r'"[^>]*onclick="([^"]+)"',generated)
              assert m, key+' nav handler missing'
              handlers[key]=m.group(1)
              Path('/tmp/broken-'+key+'.js').write_text('function t(){'+m.group(1)+'}\n',encoding='utf-8')
              print(key,'5.0.0 handler repr:',repr(m.group(1)))
          assert handlers['products']==r"show(\'products\',this)"
          assert handlers['outreach']==r"show(\'outreach\',this)"

          hot=Path('releases/5.0.1/source/server.py').read_text('utf-8')
          ns2={'__name__':'fixture501','__file__':str(Path('releases/5.0.1/source/server.py').resolve())}
          exec(compile(hot,'server501.py','exec'),ns2)
          repaired,count=ns2['patch_html'](generated)
          assert count==2
          for key in ('products','outreach'):
              m=re.search(r'data-view="'+key+r'"[^>]*onclick="([^"]+)"',repaired)
              assert m
              Path('/tmp/fixed-'+key+'.js').write_text('function t(){'+m.group(1)+'}\n',encoding='utf-8')
              assert m.group(1)=="show('"+key+"',this)"
          PY
          node --check /tmp/v5-main.js
          if node --check /tmp/broken-products.js >/tmp/broken-products.log 2>&1; then echo 'broken Products handler unexpectedly parsed'; exit 1; fi
          if node --check /tmp/broken-outreach.js >/tmp/broken-outreach.log 2>&1; then echo 'broken Outreach handler unexpectedly parsed'; exit 1; fi
          echo '5.0.0 Products failure reproduced:'
          head -6 /tmp/broken-products.log || true
          node --check /tmp/fixed-products.js
          node --check /tmp/fixed-outreach.js
