name: Publish NORTHBROWN 2.0.5 Hotfix

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.title == 'PUBLISH NORTHBROWN 2.0.5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild and validate NORTHBROWN 2.0.5
        shell: bash
        run: |
          set -euo pipefail
          VERSION='2.0.5'
          WORK="$(mktemp -d)"
          mkdir -p "$WORK/base202" northbrown/releases

          # Reconstruct the known full NORTHBROWN 2.0 source.
          python - <<'PY'
          from pathlib import Path
          p=Path('northbrown/staging/2.0.0/ota.part04')
          s=p.read_text()
          if len(s)==8999:
              s=s[:3245]+'h'+s[3245:]
              p.write_text(s)
          if len(p.read_text())!=9000:
              raise SystemExit('Unexpected base staging length')
          PY
          cat northbrown/staging/2.0.0/ota.part* | base64 -d > "$WORK/base.zip"
          echo '88f45969ed801323252b83529929dd66848560347105816cb15db727e3e69f0e  '"$WORK/base.zip" | sha256sum -c -
          unzip -t "$WORK/base.zip" >/dev/null
          unzip -q "$WORK/base.zip" -d "$WORK/base202"
          cp -R "$WORK/base202/payload" "$WORK/payload"
          P="$WORK/payload"

          # Bring the base to the 2.0.2 bridge state used by the later patches.
          python - "$P" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          (p/'VERSION.txt').write_text('2.0.2\n')
          f=p/'app.py'
          s=f.read_text().replace("APP_VERSION = '2.0.0'", "APP_VERSION = '2.0.2'", 1)
          s=s.replace("threading.Timer(0.9, lambda: os._exit(0)).start()", "threading.Timer(3.0, lambda: os._exit(0)).start()", 1)
          f.write_text(s)
          f=p/'START_NORTHBROWN_INTERNAL.sh'
          f.write_text(f.read_text().replace('.icon_ready_2_0_0','.icon_ready_2_0_2'))
          PY

          # Reapply the validated 2.0.3 and 2.0.4 source changes.
          cat northbrown/staging/2.0.3/patch.part* > "$WORK/203.patch"
          (cd "$WORK" && patch --batch -p0 < "$WORK/203.patch")
          cat northbrown/staging/2.0.4/patch.part* > "$WORK/204.patch"
          (cd "$WORK" && patch --batch -p0 < "$WORK/204.patch")

          # Apply the 2.0.5 reliability hotfix.
          cat northbrown/staging/2.0.5/patch.part* > "$WORK/205.patch"
          (cd "$WORK" && patch --batch -p0 < "$WORK/205.patch")

          # Regenerate the internal full-file manifest from the finished source.
          python - "$P" <<'PY'
          from pathlib import Path
          import hashlib, json, sys
          p=Path(sys.argv[1])
          files=[
            'app.py','feature_routes.py','builder_routes.py','requirements.txt','VERSION.txt',
            'START_NORTHBROWN_INTERNAL.sh','static/app.js','static/app.css','templates/index.html',
            'NORTHBROWN_ICON.png','static/brand-reference.svg'
          ]
          r={'format':'northbrown-full-v2','version':'2.0.5','allowed_from':['2.0.4'],'database_schema':5,'files':{}}
          for rel in files:
              f=p/rel
              if not f.is_file():
                  raise SystemExit('Missing required NORTHBROWN file: '+rel)
              r['files'][rel]=hashlib.sha256(f.read_bytes()).hexdigest()
          (p/'release.json').write_text(json.dumps(r,indent=2)+'\n')
          PY

          rm -rf "$P/__pycache__"
          test "$(tr -d '\r\n' < "$P/VERSION.txt")" = '2.0.5'
          python -m py_compile "$P/app.py" "$P/feature_routes.py" "$P/builder_routes.py"
          node --check "$P/static/app.js"
          grep -q "APP_VERSION = '2.0.5'" "$P/app.py"
          grep -q "@app.get('/northbrown-icon.png')" "$P/app.py"
          grep -q 'globalScanBar' "$P/templates/index.html"
          grep -q 'builderSaveBtn' "$P/templates/index.html"
          grep -q 'brand-reference.svg' "$P/templates/index.html"
          grep -q "scanPanelCollapsed=localStorage" "$P/static/app.js"
          grep -q 'Builder save failed' "$P/static/app.js"
          grep -q 'leadOpenInFlight' "$P/static/app.js"
          grep -q '_ai_used' "$P/builder_routes.py"
          test -s "$P/static/brand-reference.svg"

          ZIP="northbrown/releases/NORTHBROWN-update-${VERSION}.zip"
          (cd "$WORK" && zip -9qr "$GITHUB_WORKSPACE/$ZIP" payload)
          unzip -t "$ZIP" >/dev/null
          test "$(wc -c < "$ZIP")" -gt 120000
          SHA="$(sha256sum "$ZIP" | awk '{print $1}')"
          SIZE="$(wc -c < "$ZIP" | tr -d ' ')"

          cat > northbrown/update.json <<EOF
          {
            "schema": 2,
            "version": "2.0.5",
            "allowed_from": ["2.0.4"],
            "download_url": "https://raw.githubusercontent.com/EllisBrown17/yms-prospect-finder-updates/main/${ZIP}",
            "size": ${SIZE},
            "sha256": "${SHA}",
            "notes": "NORTHBROWN 2.0.5 reliability hotfix: restores the NORTHBROWN brand reference and browser NB icon, adds an always-visible scan progress bar, fixes persistent Scan Intelligence collapse, repairs Website Builder autosave and Save now, makes AI rewrite resilient with category-aware fallback and useful error reporting, and restores reliable prospect opening.",
            "published_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "mandatory": false
          }
          EOF

      - name: Publish validated OTA
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NORTHBROWN OTA Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add northbrown/releases/NORTHBROWN-update-2.0.5.zip northbrown/update.json
          git commit -m 'Publish NORTHBROWN OTA 2.0.5 reliability hotfix'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1

      - name: Close release trigger issue
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            })
