name: Extract V4.2.2 installer source

on:
  push:
    paths:
      - '.github/workflows/extract-v422-source.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract published installer source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p releases/4.2.2/source
          unzip -p releases/4.2.2/YMS_Prospect_Finder_V4_2_2_STABILITY.zip server.py > releases/4.2.2/source/server.py
          unzip -p releases/4.2.2/YMS_Prospect_Finder_V4_2_2_STABILITY.zip index.html > releases/4.2.2/source/index.html
          python3 -m py_compile releases/4.2.2/source/server.py
          git config user.name 'YMS Prospect Finder Updater'
          git config user.email 'actions@users.noreply.github.com'
          git add releases/4.2.2/source/server.py releases/4.2.2/source/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Extract V4.2.2 installer source for diagnostics'
            git push
          fi
