name: Publish NORTHBROWN 2.0.4 final OTA

on:
  push:
    branches: [main]
    paths:
      - 'northbrown/staging/2.0.4/final-trigger.txt'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build complete NORTHBROWN 2.0.4 final payload
        shell: bash
        run: |
          set -euo pipefail
          VERSION='2.0.4'
          WORK="$(mktemp -d)"
          mkdir -p "$WORK/base202" northbrown/releases

          python - <<'PY'
          from pathlib import Path
          p=Path('northbrown/staging/2.0.0/ota.part04')
          s=p.read_text()
          if len(s)==8999:
              s=s[:3245]+'h'+s[3245:]
              p.write_text(s)
          if len(p.read_text())!=9000:
              raise SystemExit('Unexpected NORTHBROWN base staging length')
          PY

          cat northbrown/staging/2.0.0/ota.part* | base64 -d > "$WORK/base.zip"
          echo '88f45969ed801323252b83529929dd66848560347105816cb15db727e3e69f0e  '"$WORK/base.zip" | sha256sum -c -
          unzip -t "$WORK/base.zip" >/dev/null
          unzip -q "$WORK/base.zip" -d "$WORK/base202"
          P202="$WORK/base202/payload"

          python - "$P202" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          (p/'VERSION.txt').write_text('2.0.2\n')
          f=p/'app.py'; s=f.read_text(); s=s.replace("APP_VERSION = '2.0.0'", "APP_VERSION = '2.0.2'", 1); s=s.replace("threading.Timer(0.9, lambda: os._exit(0)).start()", "threading.Timer(3.0, lambda: os._exit(0)).start()", 1); f.write_text(s)
          f=p/'START_NORTHBROWN_INTERNAL.sh'; s=f.read_text().replace('.icon_ready_2_0_0','.icon_ready_2_0_2'); f.write_text(s)
          PY

          cp -R "$P202" "$WORK/payload"
          cat northbrown/staging/2.0.3/patch.part* > "$WORK/203.patch"
          (cd "$WORK" && patch --batch -p0 < "$WORK/203.patch")
          rm -f "$WORK/payload/release.json"
          cat northbrown/staging/2.0.4/patch.part* > "$WORK/204.patch"
          test "$(wc -c < "$WORK/204.patch")" -eq 35765
          (cd "$WORK" && patch --batch -p0 < "$WORK/204.patch")
          P="$WORK/payload"

          python - "$P" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])

          html=p/'templates/index.html'
          s=html.read_text()
          s=s.replace('/static/NORTHBROWN_ICON.png?v=204','/static/NORTHBROWN_ICON.png?v=204-final')
          a='''            <div class="builder-tab-panel" data-builder-panel="style">\n              <div class="builder-group"><div class="section-label">DESIGN DIRECTION</div>'''
          b='''            <div class="builder-tab-panel" data-builder-panel="style">\n              <div class="builder-group"><div class="section-label">BRAND THEME</div>\n                <p class="tiny-note">Apply a complete colour direction in one click. “Business brand” uses the colour NORTHBROWN pulled from the current site when available.</p>\n                <div class="brand-theme-actions">\n                  <button type="button" class="brand-theme-choice" data-brand-theme="business"><span class="theme-dot business"></span><b>Business brand</b><small>Use their existing identity</small></button>\n                  <button type="button" class="brand-theme-choice" data-brand-theme="category"><span class="theme-dot category"></span><b>Category fit</b><small>Industry-aware palette</small></button>\n                  <button type="button" class="brand-theme-choice" data-brand-theme="northbrown"><span class="theme-dot northbrown"></span><b>NORTHBROWN</b><small>Charcoal + signature lime</small></button>\n                  <button type="button" class="brand-theme-choice" data-brand-theme="light"><span class="theme-dot light"></span><b>Clean light</b><small>Bright premium direction</small></button>\n                </div>\n                <div id="builderBrandThemeStatus" class="brand-theme-status">Custom colours</div>\n              </div>\n              <div class="builder-group"><div class="section-label">DESIGN DIRECTION</div>'''
          if a not in s: raise SystemExit('Brand theme insertion anchor missing')
          s=s.replace(a,b,1)
          a='<img src="/static/brand-reference.png" alt="Northbrown brand reference" class="brand-reference">'
          b='''<div class="brand-theme-board" aria-label="NORTHBROWN brand theme reference">\n            <div class="brand-theme-logo"><img src="/static/NORTHBROWN_ICON.png?v=204-final" alt="NORTHBROWN logo"><div><strong>NORTHBROWN.</strong><small>WEB DESIGN STUDIO</small></div></div>\n            <div class="brand-theme-swatch-row"><span class="swatch charcoal"></span><span class="swatch surface"></span><span class="swatch offwhite"></span><span class="swatch lime"></span></div>\n            <div class="brand-theme-copy"><b>Charcoal · Off-white · Lime</b><small>Premium, restrained and unmistakably NORTHBROWN.</small></div>\n          </div>'''
          if a not in s: raise SystemExit('Brand reference anchor missing')
          s=s.replace(a,b,1)
          a='<div class="scan-head-actions"><div class="scan-time-grid"><div class="scan-timer"><small>ELAPSED</small><strong id="scanElapsed">00:00</strong></div><div class="scan-timer"><small>ETA</small><strong id="scanEta">—</strong></div></div><button id="scanDismissBtn" class="scan-dismiss" title="Close Scan Intelligence" hidden>×</button></div>'
          b='<div class="scan-head-actions"><div class="scan-time-grid"><div class="scan-timer"><small>ELAPSED</small><strong id="scanElapsed">00:00</strong></div><div class="scan-timer"><small>ETA</small><strong id="scanEta">—</strong></div></div><button id="scanCollapseBtn" class="scan-collapse" title="Collapse Scan Intelligence" aria-expanded="true">−</button><button id="scanDismissBtn" class="scan-dismiss" title="Close Scan Intelligence" hidden>×</button></div>'
          if a not in s: raise SystemExit('Scan collapse anchor missing')
          s=s.replace(a,b,1)
          html.write_text(s)

          js=p/'static/app.js'
          s=js.read_text()
          s += r'''

// NORTHBROWN 2.0.4 final polish — brand themes + collapsible Scan Intelligence
(function(){
  const validHex=v=>/^#[0-9a-f]{6}$/i.test(String(v||'').trim());
  const categoryPalette=category=>{const c=String(category||'').toLowerCase();if(/barber|hair|salon|beauty|studio/.test(c))return{accent:'#c7a46a',background:'#10100f',surface:'#191816',text:'#f3efe7',label:'Category fit · Studio / grooming'};if(/funeral|care|wellbeing|therapy|physio/.test(c))return{accent:'#91a69c',background:'#111514',surface:'#19201e',text:'#eef2ef',label:'Category fit · Care'};if(/roof|plumb|electric|builder|trade|joiner|garage|mechanic/.test(c))return{accent:'#f0b64b',background:'#101112',surface:'#181a1c',text:'#f2f0ea',label:'Category fit · Trade'};if(/restaurant|cafe|coffee|food|bakery|pub|bar/.test(c))return{accent:'#c57b54',background:'#15110f',surface:'#211a17',text:'#f6eee8',label:'Category fit · Hospitality'};if(/account|solicitor|law|consult|finance|estate|dentist|clinic/.test(c))return{accent:'#6e8fbe',background:'#0f1216',surface:'#171c22',text:'#eef2f5',label:'Category fit · Professional'};if(/retail|shop|store|boutique|florist/.test(c))return{accent:'#9c7de8',background:'#111014',surface:'#1a171f',text:'#f2eef7',label:'Category fit · Retail'};return{accent:'#c6ff00',background:'#0d0d0e',surface:'#151719',text:'#f0efea',label:'Category fit · Modern'}};
  function applyPalette(pal,label){if(!window.builderState?.project)return;[['bAccent',pal.accent],['bBackground',pal.background],['bSurface',pal.surface],['bTextColor',pal.text]].forEach(([id,v])=>{const el=document.getElementById(id);if(el)el.value=v});const st=document.getElementById('builderBrandThemeStatus');if(st)st.textContent=label||'Theme applied';if(typeof markBuilderDirty==='function')markBuilderDirty();if(typeof refreshBuilderPreview==='function')refreshBuilderPreview(false)}
  function applyTheme(kind){const p=window.builderState?.project,b=p?.business||{};if(!p)return;if(kind==='northbrown')return applyPalette({accent:'#c6ff00',background:'#0d0d0e',surface:'#151719',text:'#f0efea'},'NORTHBROWN theme · Charcoal + lime');if(kind==='light')return applyPalette({accent:validHex(b.theme_color)?b.theme_color:'#202224',background:'#f5f4ef',surface:'#ffffff',text:'#17191a'},'Clean light theme');if(kind==='category'){const pal=categoryPalette(b.category);return applyPalette(pal,pal.label)}const accent=validHex(b.theme_color)?b.theme_color:categoryPalette(b.category).accent;return applyPalette({accent,background:'#0f1112',surface:'#181b1d',text:'#f1f0ea'},validHex(b.theme_color)?`Business brand · Pulled ${accent}`:'Business brand · Using best category colour')}
  document.querySelectorAll('[data-brand-theme]').forEach(btn=>btn.addEventListener('click',()=>applyTheme(btn.dataset.brandTheme)));
  const styleTab=document.querySelector('[data-builder-tab="style"]');if(styleTab)styleTab.addEventListener('click',()=>{const p=window.builderState?.project,b=p?.business||{},st=document.getElementById('builderBrandThemeStatus');if(st)st.textContent=validHex(b.theme_color)?`Brand colour found: ${b.theme_color}`:'No reliable brand colour pulled yet · use Category fit or customise below'});
  const panel=document.getElementById('scanProgressPanel'),collapse=document.getElementById('scanCollapseBtn');
  const setCollapsed=value=>{if(!panel||!collapse)return;panel.classList.toggle('collapsed',!!value);collapse.textContent=value?'＋':'−';collapse.title=value?'Expand Scan Intelligence':'Collapse Scan Intelligence';collapse.setAttribute('aria-expanded',value?'false':'true');try{localStorage.setItem('northbrown_scan_collapsed',value?'1':'0')}catch{}};
  if(panel&&collapse){let initial=false;try{initial=localStorage.getItem('northbrown_scan_collapsed')==='1'}catch{}setCollapsed(initial);collapse.addEventListener('click',()=>setCollapsed(!panel.classList.contains('collapsed')))}
})();
'''
          js.write_text(s)

          css=p/'static/app.css'
          s=css.read_text()
          s += r'''

/* NORTHBROWN 2.0.4 final polish — brand themes + collapsible Scan Intelligence */
.brand-theme-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.brand-theme-choice{display:grid;grid-template-columns:20px 1fr;grid-template-rows:auto auto;column-gap:9px;align-items:center;text-align:left;padding:10px;border:1px solid rgba(255,255,255,.07);border-radius:11px;background:#141617;color:#e8e9e3;cursor:pointer;transition:.18s}.brand-theme-choice:hover{border-color:rgba(198,255,0,.28);transform:translateY(-1px)}.brand-theme-choice .theme-dot{grid-row:1/3;width:18px;height:18px;border-radius:50%;box-shadow:0 0 0 3px rgba(255,255,255,.04)}.theme-dot.business{background:linear-gradient(135deg,#c7a46a 0 50%,#232526 50%)}.theme-dot.category{background:linear-gradient(135deg,#6e8fbe,#c57b54)}.theme-dot.northbrown{background:#c6ff00}.theme-dot.light{background:#f5f4ef;border:1px solid #bfc1bd}.brand-theme-choice b{font-size:9px}.brand-theme-choice small{font-size:7px;color:#6c716e;margin-top:2px}.brand-theme-status{margin-top:9px;padding:8px 9px;border-radius:9px;background:#0f1112;border:1px solid rgba(255,255,255,.055);color:#777d79;font-size:8px}.brand-theme-board{margin-top:20px;padding:18px;border:1px solid rgba(255,255,255,.08);border-radius:18px;background:linear-gradient(145deg,#111315,#0d0e0f);box-shadow:inset 0 1px 0 rgba(255,255,255,.025)}.brand-theme-logo{display:flex;align-items:center;gap:13px}.brand-theme-logo img{width:58px;height:58px;border-radius:14px;border:1px solid rgba(255,255,255,.08)}.brand-theme-logo strong{display:block;font:700 15px Manrope,sans-serif;letter-spacing:.08em;color:#f0efea}.brand-theme-logo small{display:block;margin-top:4px;color:#6d716e;font-size:7px;letter-spacing:.2em}.brand-theme-swatch-row{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:18px 0 12px}.brand-theme-swatch-row .swatch{height:32px;border-radius:9px;border:1px solid rgba(255,255,255,.07)}.swatch.charcoal{background:#0d0d0e}.swatch.surface{background:#191b1d}.swatch.offwhite{background:#f0efea}.swatch.lime{background:#c6ff00}.brand-theme-copy b{display:block;font-size:9px;color:#dfe1da}.brand-theme-copy small{display:block;margin-top:4px;color:#6f7470;font-size:8px;line-height:1.45}.scan-collapse{width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.14);background:#17191b;color:#f0efea;font-size:18px;line-height:1;cursor:pointer}.scan-collapse:hover{border-color:#c6ff00;color:#c6ff00}.scan-progress-panel.collapsed{width:min(560px,calc(100vw - 36px));padding-bottom:14px}.scan-progress-panel.collapsed .scan-live-card,.scan-progress-panel.collapsed .scan-counters,.scan-progress-panel.collapsed .scan-cost-line,.scan-progress-panel.collapsed .scan-summary,.scan-progress-panel.collapsed .scan-controls,.scan-progress-panel.collapsed .scan-activity-log,.scan-progress-panel.collapsed .scan-progress-meta{display:none!important}.scan-progress-panel.collapsed .scan-progress-head{margin-bottom:10px}.scan-progress-panel.collapsed .scan-progress-track{margin-bottom:0}.scan-progress-panel.collapsed #scanProgressTitle{max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:inline-block;vertical-align:middle}.scan-progress-panel.collapsed .scan-time-grid{display:flex;gap:6px}.scan-progress-panel.collapsed .scan-timer{min-width:62px;padding:6px 8px}.scan-progress-panel.collapsed .scan-timer small{font-size:6px}.scan-progress-panel.collapsed .scan-timer strong{font-size:10px}@media(max-width:700px){.brand-theme-actions{grid-template-columns:1fr}.scan-progress-panel.collapsed .scan-time-grid{display:none}.scan-progress-panel.collapsed #scanProgressTitle{max-width:190px}}
'''
          css.write_text(s)
          PY

          python - "$P" <<'PY'
          from pathlib import Path
          import hashlib, json, sys
          p=Path(sys.argv[1])
          files=['app.py','feature_routes.py','builder_routes.py','requirements.txt','VERSION.txt','START_NORTHBROWN_INTERNAL.sh','static/app.js','static/app.css','templates/index.html','NORTHBROWN_ICON.png','static/NORTHBROWN_ICON.png']
          r={'format':'northbrown-full-v2','version':'2.0.4','allowed_from':['2.0.2','2.0.3'],'database_schema':5,'files':{}}
          for rel in files:
              f=p/rel
              if not f.is_file(): raise SystemExit('Missing required NORTHBROWN file: '+rel)
              r['files'][rel]=hashlib.sha256(f.read_bytes()).hexdigest()
          (p/'release.json').write_text(json.dumps(r,indent=2)+'\n')
          PY

          test "$(tr -d '\r\n' < "$P/VERSION.txt")" = '2.0.4'
          python -m py_compile "$P/app.py" "$P/feature_routes.py" "$P/builder_routes.py"
          node --check "$P/static/app.js"
          grep -q "APP_VERSION = '2.0.4'" "$P/app.py"
          grep -q "@app.post('/api/smart-finder')" "$P/app.py"
          grep -q "'key':'barber'" "$P/builder_routes.py"
          grep -q "Fades & short styles" "$P/builder_routes.py"
          grep -q "scanCollapseBtn" "$P/templates/index.html"
          grep -q "BRAND THEME" "$P/templates/index.html"
          grep -q "NORTHBROWN_ICON.png?v=204-final" "$P/templates/index.html"
          grep -q "Free Google tools for websites" "$P/templates/index.html"

          rm -rf "$P/__pycache__"
          ZIP="northbrown/releases/NORTHBROWN-update-${VERSION}.zip"
          (cd "$WORK" && zip -qr "$GITHUB_WORKSPACE/$ZIP" payload)
          unzip -t "$ZIP" >/dev/null
          test "$(wc -c < "$ZIP")" -gt 120000
          SHA="$(sha256sum "$ZIP" | awk '{print $1}')"
          SIZE="$(wc -c < "$ZIP" | tr -d ' ')"

          cat > northbrown/update.json <<EOF
          {
            "schema": 2,
            "version": "2.0.4",
            "allowed_from": ["2.0.2", "2.0.3"],
            "download_url": "https://raw.githubusercontent.com/EllisBrown17/yms-prospect-finder-updates/main/${ZIP}",
            "size": ${SIZE},
            "sha256": "${SHA}",
            "notes": "NORTHBROWN 2.0.4: smarter category-accurate website generation, Smart Finder, free Google website tools, NORTHBROWN logo on the Mac launcher and browser tab, restored NORTHBROWN brand theme reference, one-click Website Builder brand themes and collapsible Scan Intelligence.",
            "published_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "mandatory": false
          }
          EOF

      - name: Publish validated OTA
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NORTHBROWN OTA Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add northbrown/releases/NORTHBROWN-update-2.0.4.zip northbrown/update.json
          git commit -m 'Publish NORTHBROWN OTA 2.0.4 final branded build'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
