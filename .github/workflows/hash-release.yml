name: Extract known-good V4.1.2 base

on:
  push:
    paths:
      - 'releases/**'
      - '.github/workflows/hash-release.yml'

permissions:
  contents: write

jobs:
  base:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Extract working V4.1.2 app files
        shell: bash
        run: |
          set -e
          mkdir -p hashes releases/4.2.0/base
          ZIP='releases/4.1.2/YMS_Prospect_Finder_V4_1_2_OTA_VERIFICATION_BRIDGE.zip'
          unzip -t "$ZIP" > hashes/v4.1.2-base-validation.txt
          unzip -p "$ZIP" server.py > releases/4.2.0/base/server.py
          unzip -p "$ZIP" index.html > releases/4.2.0/base/index.html
          echo "server-bytes: $(wc -c < releases/4.2.0/base/server.py)" >> hashes/v4.1.2-base-validation.txt
          echo "index-bytes: $(wc -c < releases/4.2.0/base/index.html)" >> hashes/v4.1.2-base-validation.txt
          echo 'version-lines:' >> hashes/v4.1.2-base-validation.txt
          grep -nE 'APP_VERSION|TARGET_VERSION' releases/4.2.0/base/server.py | head -10 >> hashes/v4.1.2-base-validation.txt || true
          python3 -m py_compile releases/4.2.0/base/server.py
          git config user.name 'YMS Prospect Finder Updater'
          git config user.email 'actions@users.noreply.github.com'
          git add releases/4.2.0/base/server.py releases/4.2.0/base/index.html hashes/v4.1.2-base-validation.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Extract known-good V4.1.2 base for Smart Finder rebuild'
            git push
          fi
