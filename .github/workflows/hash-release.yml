name: Build and validate V4.2 release package

on:
  push:
    paths:
      - 'releases/**'
      - '.github/workflows/hash-release.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Diagnose deterministic source and publish report
        shell: bash
        run: |
          set +e
          mkdir -p hashes
          SRC='releases/4.2.0/YMS_Prospect_Finder_V4_2_0_DETERMINISTIC.zip.b64'
          OUT='releases/4.2.0/YMS_Prospect_Finder_V4_2_0_BINARY.zip'
          REPORT='hashes/v4.2.0-binary-validation.txt'
          : > "$REPORT"
          echo "source-bytes: $(wc -c < "$SRC")" >> "$REPORT"
          base64 --decode "$SRC" > "$OUT" 2>> "$REPORT"
          echo "base64-exit: $?" >> "$REPORT"
          echo "decoded-bytes: $(wc -c < "$OUT")" >> "$REPORT"
          echo "file: $(file -b "$OUT")" >> "$REPORT"
          sha256sum "$OUT" | awk '{print "sha256: "$1}' >> "$REPORT"
          echo 'unzip-test:' >> "$REPORT"
          unzip -t "$OUT" >> "$REPORT" 2>&1
          echo "unzip-exit: $?" >> "$REPORT"
          git config user.name 'YMS Prospect Finder Updater'
          git config user.email 'actions@users.noreply.github.com'
          git add "$REPORT"
          if ! git diff --cached --quiet; then
            git commit -m 'Record deterministic V4.2 ZIP diagnostics'
            git push
          fi
