name: Diagnose YMS updater channel
on:
  push:
    branches: [yms-5.0.2-updater-channel-fix]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Inspect original updater source
        run: |
          set -euo pipefail
          rm -rf /tmp/yms420ota && mkdir -p /tmp/yms420ota
          unzip -o releases/4.2.0/YMS_Prospect_Finder_V4_2_0_OTA.zip -d /tmp/yms420ota >/dev/null
          echo '--- files ---'
          find /tmp/yms420ota -maxdepth 2 -type f -print -exec wc -c {} \;
          echo '--- updater references ---'
          grep -nEi 'manifest|release channel|release_channel|check for updates|github|raw.githubusercontent|updater|update_available|latest|channel|sha256|package_url' /tmp/yms420ota/server.py || true
          echo '--- updater-related source windows ---'
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/yms420ota/server.py').read_text('utf-8')
          lines=s.splitlines()
          needles=['manifest','release channel','package_url','update/check','update_status','check_update','raw.githubusercontent','github.com','UPDATE_MANIFEST','update_manifest']
          hits=[]
          for i,line in enumerate(lines):
              if any(n.lower() in line.lower() for n in needles): hits.append(i)
          spans=[]
          for i in hits:
              a=max(0,i-12); b=min(len(lines),i+26)
              if any(a>=x and b<=y for x,y in spans): continue
              spans.append((a,b))
              print(f'\n### lines {a+1}-{b}')
              for j in range(a,b): print(f'{j+1}: {lines[j]}')
          PY
