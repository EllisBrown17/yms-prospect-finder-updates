name: Diagnose YMS 5.0.0 V5 browser syntax
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Extract and syntax-check exact V5 browser block
        run: |
          set -euo pipefail
          rm -rf /tmp/yms500 && mkdir -p /tmp/yms500
          unzip -o releases/5.0.0/YMS_Prospect_Finder_V5_0_0_PRODUCT_OUTREACH_INTELLIGENCE.zip -d /tmp/yms500 >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          old=Path('/tmp/yms500/server.py').read_text('utf-8')
          ns={'__name__':'fixture500','__file__':'/tmp/yms500/server.py'}
          exec(compile(old,'server500.py','exec'),ns)
          v5=ns['V5_JS']
          js=v5[v5.find('<script>')+8:v5.rfind('</script>')]
          Path('/tmp/v5.js').write_text(js,encoding='utf-8')
          print('v5_length',len(js),'backslash_quote_count',js.count("\\'"),'backslash_count',js.count('\\'))
          PY
          echo '--- Node parser output ---'
          node --check /tmp/v5.js
