name: Diagnose YMS updater channel
on:
  push:
    branches: [yms-5.0.2-updater-channel-fix]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Inspect updater bridge history
        run: |
          set -euo pipefail
          for spec in \
            '4.1.1 releases/4.1.1/YMS_Prospect_Finder_OTA_BRIDGE.zip' \
            '4.1.2 releases/4.1.2/YMS_Prospect_Finder_V4_1_2_OTA_VERIFICATION_BRIDGE.zip' \
            '4.2.11 releases/4.2.11/YMS_Prospect_Finder_V4_2_11_PERSISTENT_DESKTOP_FIX.zip'; do
            VER="${spec%% *}"; ZIP="${spec#* }"; DIR="/tmp/yms-${VER}"
            rm -rf "$DIR" && mkdir -p "$DIR"
            unzip -o "$ZIP" -d "$DIR" >/dev/null
            echo
            echo "================ $VER ================"
            find "$DIR" -maxdepth 2 -type f -print
            for f in "$DIR"/*; do
              [ -f "$f" ] || continue
              if file "$f" | grep -qi text; then
                echo "--- $f ---"
                grep -nEi 'manifest|release channel|release_channel|check for updates|github|raw.githubusercontent|updater|update_available|latest|channel|sha256' "$f" || true
                if [ "$VER" = '4.1.1' ] || [ "$VER" = '4.1.2' ]; then
                  cat "$f"
                fi
              fi
            done
          done
