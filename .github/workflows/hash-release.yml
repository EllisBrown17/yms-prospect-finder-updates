name: Repair and validate V4.2 release package

on:
  push:
    paths:
      - 'releases/**'
      - '.github/workflows/hash-release.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Repair original binary ZIP and publish diagnostics
        shell: bash
        run: |
          set +e
          mkdir -p hashes
          SRC='releases/4.2.0/YMS_Prospect_Finder_V4_2_0_PATCH_FIXED.zip'
          OUT='releases/4.2.0/YMS_Prospect_Finder_V4_2_0_RECOVERED2.zip'
          REPORT='hashes/v4.2.0-recovery2-validation.txt'
          rm -f "$OUT"
          : > "$REPORT"
          echo "source-bytes: $(wc -c < "$SRC")" >> "$REPORT"
          echo "source-file: $(file -b "$SRC")" >> "$REPORT"
          echo 'zip-FF-output:' >> "$REPORT"
          printf 'y\ny\ny\ny\n' | zip -FF "$SRC" --out "$OUT" >> "$REPORT" 2>&1
          ZIP_EXIT=$?
          echo "zip-FF-exit: $ZIP_EXIT" >> "$REPORT"
          if [ -f "$OUT" ]; then
            echo "recovered-bytes: $(wc -c < "$OUT")" >> "$REPORT"
            echo "recovered-file: $(file -b "$OUT")" >> "$REPORT"
            sha256sum "$OUT" | awk '{print "sha256: "$1}' >> "$REPORT"
            echo 'unzip-test:' >> "$REPORT"
            unzip -t "$OUT" >> "$REPORT" 2>&1
            UNZIP_EXIT=$?
            echo "unzip-exit: $UNZIP_EXIT" >> "$REPORT"
          else
            UNZIP_EXIT=99
            echo 'No recovered ZIP was produced.' >> "$REPORT"
          fi
          git config user.name 'YMS Prospect Finder Updater'
          git config user.email 'actions@users.noreply.github.com'
          git add "$REPORT"
          if [ -f "$OUT" ]; then git add "$OUT"; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Repair and validate V4.2.0 OTA ZIP'
            git push
          fi
