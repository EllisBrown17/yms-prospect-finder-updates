name: Build NORTHBROWN 2.0.11 release

on:
  push:
    branches: ["nb211-build"]
    paths:
      - ".github/workflows/build-northbrown-2.0.11.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nb211-build
      - name: Rebuild verified OTA archive
        shell: bash
        run: |
          set -euo pipefail
          cat northbrown/build/2.0.11/part0.b64 \
              northbrown/build/2.0.11/part1.b64 \
              northbrown/build/2.0.11/part2.b64 \
              northbrown/build/2.0.11/part3.b64 \
              northbrown/build/2.0.11/part4.b64 \
              northbrown/build/2.0.11/part5.b64 | base64 --decode > /tmp/NORTHBROWN-update-2.0.11.zip
          test "$(stat -c%s /tmp/NORTHBROWN-update-2.0.11.zip)" = "30344"
          echo "9f21b5b4ae64a0ce29ba8326b6762495a2a236c28f9a76efabf83238cc609f41  /tmp/NORTHBROWN-update-2.0.11.zip" | sha256sum -c -
          unzip -t /tmp/NORTHBROWN-update-2.0.11.zip
          mkdir -p northbrown/releases
          cp /tmp/NORTHBROWN-update-2.0.11.zip northbrown/releases/NORTHBROWN-update-2.0.11.zip
      - name: Commit release archive
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add northbrown/releases/NORTHBROWN-update-2.0.11.zip
          git diff --cached --quiet && exit 0
          git commit -m "Build verified NORTHBROWN 2.0.11 OTA"
          git push origin HEAD:nb211-build
