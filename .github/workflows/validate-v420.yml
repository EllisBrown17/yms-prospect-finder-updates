name: Validate V4.2 package

on:
  push:
    paths:
      - '.github/workflows/validate-v420.yml'
      - 'releases/4.2.0/**'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate exact OTA archive
        shell: bash
        run: |
          set +e
          mkdir -p hashes
          FILE='releases/4.2.0/YMS_Prospect_Finder_V4_2_0_PATCH_FIXED.zip'
          {
            echo "file: $(file -b \"$FILE\")"
            echo "sha256: $(sha256sum \"$FILE\" | awk '{print $1}')"
            echo 'unzip-test:'
            unzip -t "$FILE"
            echo "unzip-exit: $?"
          } > hashes/v4.2.0-validation.txt 2>&1
          git config user.name 'YMS Prospect Finder Updater'
          git config user.email 'actions@users.noreply.github.com'
          git add hashes/v4.2.0-validation.txt
          git commit -m 'Record V4.2.0 ZIP validation' || true
          git push || true
