name: Build YMS Prospect Finder V4.2.3 Robust Hotfix

on:
  push:
    paths:
      - 'releases/4.2.3/package.b64'
      - '.github/workflows/build-v423.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and validate V4.2.3
        shell: bash
        run: |
          set -euo pipefail
          SRC='releases/4.2.3/package.b64'
          OUT='releases/4.2.3/YMS_Prospect_Finder_V4_2_3_STABILITY_HOTFIX.zip'
          REPORT='releases/4.2.3/VALIDATION.txt'
          HASH='releases/4.2.3/SHA256.txt'
          base64 --decode "$SRC" > "$OUT"
          unzip -t "$OUT" | tee "$REPORT"
          rm -rf /tmp/yms423 && mkdir -p /tmp/yms423
          unzip -q "$OUT" -d /tmp/yms423
          python3 -m py_compile /tmp/yms423/server.py
          grep -q 'TARGET_VERSION="4.2.3"' /tmp/yms423/server.py
          grep -q 'V4.2.3 stability overrides' /tmp/yms423/server.py
          grep -q '_v423_find_facebook' /tmp/yms423/server.py
          grep -q '_v423_transient_kind' /tmp/yms423/server.py
          grep -q '_v423_old_resume_progress_job' /tmp/yms423/server.py
          grep -q 'compile(s,"server.py","exec")' /tmp/yms423/server.py
          sha256sum "$OUT" | awk '{print $1}' > "$HASH"
          echo "file: $(file -b "$OUT")" >> "$REPORT"
          echo "bytes: $(wc -c < "$OUT")" >> "$REPORT"
          echo 'patcher compile: OK' >> "$REPORT"
          echo 'architecture: additive overrides before Handler; no function-body slicing' >> "$REPORT"
          echo 'installer compiles the fully patched server before replacing the working app' >> "$REPORT"
          git config user.name 'YMS Prospect Finder Updater'
          git config user.email 'actions@users.noreply.github.com'
          git add "$OUT" "$REPORT" "$HASH"
          if ! git diff --cached --quiet; then
            git commit -m 'Publish validated V4.2.3 robust stability hotfix'
            git push
          fi
# trigger rebuild after workflow existed on main
