name: Extract V4.2.1 source for V4.2.2

on:
  push:
    paths:
      - '.github/workflows/extract-v421-source.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract validated V4.2.1 OTA source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p releases/4.2.2/base
          ZIP='releases/4.2.1/YMS_Prospect_Finder_V4_2_1_INDIVIDUAL_WORKFLOW_FIX.zip'
          unzip -t "$ZIP"
          unzip -p "$ZIP" server.py > releases/4.2.2/base/server.py
          unzip -p "$ZIP" index.html > releases/4.2.2/base/index.html
          python3 -m py_compile releases/4.2.2/base/server.py
          git config user.name 'YMS Prospect Finder Updater'
          git config user.email 'actions@users.noreply.github.com'
          git add releases/4.2.2/base/server.py releases/4.2.2/base/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Extract V4.2.1 source for Facebook fallback update'
            git push
          fi
