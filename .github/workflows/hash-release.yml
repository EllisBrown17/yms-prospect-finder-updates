name: Recover V4.2 Smart Finder backend

on:
  push:
    paths:
      - 'releases/**'
      - '.github/workflows/hash-release.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Extract and compile recovered server.py
        shell: bash
        run: |
          set +e
          mkdir -p hashes releases/4.2.0/recovered
          ZIP='releases/4.2.0/YMS_Prospect_Finder_V4_2_0_RECOVERED2.zip'
          PY='releases/4.2.0/recovered/server.py'
          REPORT='hashes/v4.2.0-recovered-server-validation.txt'
          : > "$REPORT"
          unzip -p "$ZIP" server.py > "$PY" 2>> "$REPORT"
          echo "unzip-p-exit: $?" >> "$REPORT"
          echo "server-bytes: $(wc -c < "$PY")" >> "$REPORT"
          echo "server-file: $(file -b "$PY")" >> "$REPORT"
          echo 'version-lines:' >> "$REPORT"
          grep -nE 'APP_VERSION|4\.2|Smart Finder|smart_finder|smart finder' "$PY" | head -30 >> "$REPORT" 2>&1
          echo 'compile:' >> "$REPORT"
          python3 -m py_compile "$PY" >> "$REPORT" 2>&1
          echo "compile-exit: $?" >> "$REPORT"
          echo 'tail:' >> "$REPORT"
          tail -8 "$PY" >> "$REPORT" 2>&1
          git config user.name 'YMS Prospect Finder Updater'
          git config user.email 'actions@users.noreply.github.com'
          git add "$PY" "$REPORT"
          if ! git diff --cached --quiet; then
            git commit -m 'Recover and compile V4.2 Smart Finder backend'
            git push
          fi
