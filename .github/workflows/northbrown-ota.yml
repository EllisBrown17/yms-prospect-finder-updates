name: Build NORTHBROWN OTA update

on:
  workflow_dispatch:
  push:
    paths:
      - 'northbrown/patches/current/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate complete NORTHBROWN payload
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD="northbrown/patches/current/payload"
          test -f "$PAYLOAD/VERSION.txt"
          test -f "$PAYLOAD/app.py"
          test -f "$PAYLOAD/feature_routes.py"
          test -f "$PAYLOAD/requirements.txt"
          test -f "$PAYLOAD/static/app.js"
          test -f "$PAYLOAD/static/app.css"
          test -f "$PAYLOAD/templates/index.html"
          test "$(wc -c < "$PAYLOAD/app.py")" -gt 20000
          test "$(wc -c < "$PAYLOAD/feature_routes.py")" -gt 20000
          test "$(wc -c < "$PAYLOAD/static/app.js")" -gt 10000
          test "$(wc -c < "$PAYLOAD/templates/index.html")" -gt 10000
          python -m py_compile "$PAYLOAD/app.py" "$PAYLOAD/feature_routes.py"
          grep -q "NORTHBROWN_HEALTHCHECK_OK" "$PAYLOAD/app.py"
          if ls "$PAYLOAD"/patch*.part* >/dev/null 2>&1; then
            echo "Refusing to publish a transition/patch payload. NORTHBROWN OTA releases must contain complete runtime files."
            exit 1
          fi

      - name: Build verified OTA package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < northbrown/patches/current/payload/VERSION.txt)"
          test -n "$VERSION"
          mkdir -p northbrown/releases
          rm -f "northbrown/releases/NORTHBROWN-update-${VERSION}.zip"
          cd northbrown/patches/current
          zip -qr "../../releases/NORTHBROWN-update-${VERSION}.zip" payload
          cd ../../..
          ZIP="northbrown/releases/NORTHBROWN-update-${VERSION}.zip"
          SHA="$(sha256sum "$ZIP" | awk '{print $1}')"
          unzip -t "$ZIP" >/dev/null
          cat > northbrown/update.json <<EOF
          {
            "version": "${VERSION}",
            "download_url": "https://raw.githubusercontent.com/EllisBrown17/yms-prospect-finder-updates/main/${ZIP}",
            "sha256": "${SHA}",
            "notes": "GitHub-powered NORTHBROWN OTA update. Install from Settings > Software updates.",
            "published_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "mandatory": false
          }
          EOF

      - name: Publish release payload and manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "NORTHBROWN OTA Bot"
          git config user.email "actions@users.noreply.github.com"
          git add northbrown/releases northbrown/update.json
          if git diff --cached --quiet; then
            echo "Nothing new to publish"
            exit 0
          fi
          git commit -m "Publish NORTHBROWN OTA $(cat northbrown/patches/current/payload/VERSION.txt)"
          git push
